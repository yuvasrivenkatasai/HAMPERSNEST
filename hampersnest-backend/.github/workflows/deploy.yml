name: Production Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-backend-deployment
  cancel-in-progress: false

jobs:
  # ============================================================
  # STAGE 1: CI & Quality Gate (Runs on GitHub Actions runner)
  # If this stage fails, the live server is NEVER touched!
  # ============================================================
  test-and-validate:
    name: 1. CI Validation & Syntax Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Environment Template Exists
        run: test -f .env.example

      - name: Validate JavaScript Syntax Across All Modules
        run: |
          echo "Checking syntax across server.js and all modules..."
          node -c server.js
          find controllers routes database utils -name "*.js" -exec node -c {} +
          echo "All JavaScript files passed syntax verification successfully!"

  # ============================================================
  # STAGE 2: Safe CD Deployment & Auto-Rollback Gate
  # Runs ONLY if Stage 1 passes!
  # ============================================================
  deploy:
    name: 2. Zero-Downtime Deploy & Rollback Gate
    needs: test-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -e
            echo "=========================================================="
            echo " Starting Enterprise Safe Deployment: HampersNest Backend"
            echo "=========================================================="
            cd /home/ubuntu/hampersnest-backend
            
            # Step 1: Capture previous healthy commit for rollback safety
            PREV_COMMIT=$(git rev-parse HEAD)
            echo "Current running commit reference: $PREV_COMMIT"
            
            # Step 2: Define rollback function if anything goes wrong
            rollback() {
              echo "::error::DEPLOYMENT FAILED! Initiating automatic rollback to $PREV_COMMIT..."
              git reset --hard "$PREV_COMMIT"
              npm install --omit=dev
              pm2 reload hampersnest-backend --update-env || pm2 restart hampersnest-backend --update-env
              pm2 save
              echo "Rolled back successfully to previous healthy state."
              exit 1
            }
            trap rollback ERR
            
            # Step 3: Fetch and update to latest code
            echo "[Step 1/4] Pulling latest code from main branch..."
            git fetch origin main
            git reset --hard origin/main
            NEW_COMMIT=$(git rev-parse HEAD)
            echo "Updated to target commit: $NEW_COMMIT"
            
            # Step 4: Install dependencies
            echo "[Step 2/4] Installing production dependencies..."
            npm install --omit=dev
            
            # Step 5: Gracefully reload PM2 (zero-downtime reload)
            echo "[Step 3/4] Gracefully reloading PM2 application..."
            pm2 reload hampersnest-backend --update-env || pm2 restart hampersnest-backend --update-env
            pm2 save
            
            # Step 6: Active Multi-Attempt Health Check
            echo "[Step 4/4] Verifying health check on http://127.0.0.1:5000/..."
            HEALTH_OK=0
            for i in 1 2 3 4 5; do
              sleep 2
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Health check attempt $i: PASSED (HTTP $HTTP_CODE)"
                HEALTH_OK=1
                break
              else
                echo "Health check attempt $i: Status $HTTP_CODE (retrying...)"
              fi
            done
            
            if [ "$HEALTH_OK" -ne 1 ]; then
              echo "Health check failed after 5 attempts!"
              rollback
            fi
            
            # Clear trap on success
            trap - ERR
            echo "=========================================================="
            echo " SUCCESS: HampersNest Backend is live and healthy! "
            echo "=========================================================="
