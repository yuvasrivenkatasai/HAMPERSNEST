name: Deploy Backend to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-backend-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            echo "============================================="
            echo " Starting HampersNest Backend Deployment"
            echo "============================================="
            cd /home/ubuntu/hampersnest-backend
            
            echo "[1/4] Pulling latest updates from git..."
            git fetch origin main
            git reset --hard origin/main
            
            echo "[2/4] Installing production dependencies..."
            npm install --omit=dev
            
            echo "[3/4] Gracefully reloading PM2 process..."
            pm2 reload hampersnest-backend --update-env || pm2 restart hampersnest-backend --update-env
            pm2 save
            
            echo "[4/4] Verifying API health check..."
            sleep 3
            curl -f http://127.0.0.1:5000/ || exit 1
            
            echo "============================================="
            echo " HampersNest Backend Deployed Successfully! "
            echo "============================================="
