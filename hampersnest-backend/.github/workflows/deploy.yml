name: Production Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-backend-deployment
  cancel-in-progress: false

jobs:
  # ============================================================
  # STAGE 1: CI & Quality Gate (Runs in 2s with pre-installed Node)
  # Uses pre-installed system Node (No zip/tar downloads needed!)
  # If this stage fails, the live server is NEVER touched!
  # ============================================================
  test-and-validate:
    name: 1. Fast CI Syntax Gate
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Environment Template Exists
        run: test -f .env.example

      - name: Validate JavaScript Syntax Across All Modules
        run: |
          echo "Using pre-installed runner Node: $(node -v)"
          echo "Checking syntax across server.js and all modules..."
          node -c server.js
          find controllers routes database utils -name "*.js" -exec node -c {} +
          echo "All JavaScript files passed syntax verification successfully!"

  # ============================================================
  # STAGE 2: Safe CD Deployment & Auto-Rollback Gate
  # Runs ONLY if Stage 1 passes!
  # ============================================================
  deploy:
    name: 2. Zero-Downtime Deploy & Rollback Gate
    needs: test-and-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy to Remote Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd /home/ubuntu/hampersnest-backend
            git fetch origin main
            git reset --hard origin/main
            chmod +x scripts/deploy.sh
            bash scripts/deploy.sh
