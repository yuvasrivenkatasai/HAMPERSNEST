name: Database CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    name: Lint & Test Schema
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify Environment Template
        run: test -f .env.example

      - name: Run Schema & CRUD Test Suite
        run: npm test
