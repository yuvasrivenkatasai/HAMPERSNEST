name: Deploy Database to Production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Type "DEPLOY" to confirm applying schema changes to Production Oracle DB'
        required: true
        default: 'DEPLOY'
  push:
    branches:
      - main
    paths:
      - 'schema/**'
      - 'seeds/**'
      - 'migrations/**'
      - 'knexfile.js'
      - 'package.json'

concurrency:
  group: production-db-deployment
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test & Deploy Production Schema
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: package.json

      - name: 3. Install Project Dependencies
        run: npm ci || npm install

      - name: 4. Run Automated Test Suite (Safety Gate)
        run: npm test

      - name: 5. Verify Safety Confirmation
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]; then
            echo "::error::Deployment aborted! Input did not match 'DEPLOY'."
            exit 1
          fi

      - name: 6. Check Required Secrets
        run: |
          if [ -z "${{ secrets.DB_USER }}" ] || [ -z "${{ secrets.ORACLE_WALLET_BASE64 }}" ]; then
            echo "::error::Missing GitHub Secrets! Please add DB_USER, DB_PASSWORD, DB_SERVICE_NAME, DB_WALLET_PASSWORD, and ORACLE_WALLET_BASE64 in Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: 7. Decode Oracle Cloud Wallet
        run: |
          mkdir -p ./wallet
          echo "${{ secrets.ORACLE_WALLET_BASE64 }}" | base64 -d > /tmp/wallet.zip
          unzip -o /tmp/wallet.zip -d ./wallet
          rm -f /tmp/wallet.zip
          echo "Oracle Cloud Wallet files extracted successfully."

      - name: 8. Pre-Deployment Connection & Health Check
        run: npm run db:verify
        env:
          NODE_ENV: production
          DB_DIALECT: oracle
          DB_CLIENT: oracledb
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SERVICE_NAME: ${{ secrets.DB_SERVICE_NAME }}
          DB_WALLET_PATH: ./wallet
          DB_WALLET_PASSWORD: ${{ secrets.DB_WALLET_PASSWORD }}

      - name: 9. Synchronize Schema (Create / Alter Tables)
        run: npm run db:sync
        env:
          NODE_ENV: production
          DB_DIALECT: oracle
          DB_CLIENT: oracledb
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SERVICE_NAME: ${{ secrets.DB_SERVICE_NAME }}
          DB_WALLET_PATH: ./wallet
          DB_WALLET_PASSWORD: ${{ secrets.DB_WALLET_PASSWORD }}

      - name: 10. Post-Deployment Verification
        run: npm run db:verify
        env:
          NODE_ENV: production
          DB_DIALECT: oracle
          DB_CLIENT: oracledb
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SERVICE_NAME: ${{ secrets.DB_SERVICE_NAME }}
          DB_WALLET_PATH: ./wallet
          DB_WALLET_PASSWORD: ${{ secrets.DB_WALLET_PASSWORD }}

      - name: 11. Cleanup Cloud Wallet from Runner
        if: always()
        run: rm -rf ./wallet
